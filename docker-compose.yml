services:
  web:
    build: .
    image: exam-credentials:latest
    container_name: exam_credentials
    restart: unless-stopped
    ports:
      - "${LISTEN_ADDR:-0.0.0.0}:${HTTP_PORT:-8765}:5000"   # адрес и порт на хосте, см. .env
    env_file: .env          # SECRET_KEY, ENCRYPTION_KEY и т.п.; в git не попадает
    volumes:
      - creds-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/admin/login')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  creds-data: